name: build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional pytest selector passed to tox as posargs'
        required: false
        default: ''

jobs:
  tests:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: [ubuntu-22.04, windows-latest]
        tox-env: [py37, py38, py39, py310, py311, nolxml, nohtml5lib]
        include:
          - tox-env: py37
            python-version: 3.7
          - tox-env: py38
            python-version: 3.8
          - tox-env: py39
            python-version: '3.9.13'
          - tox-env: py310
            python-version: '3.10.11'
          - tox-env: py311
            python-version: '3.11.3'
          - tox-env: nolxml
            python-version: '3.11.3'
          - tox-env: nohtml5lib
            python-version: '3.10.11'

    env:
      TOXENV: ${{ matrix.tox-env }}

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade --index-url 'https://:2023-04-16@time-machines-pypi.sealsecurity.io/' pip setuptools build tox coverage
    - name: Test
      run: |
        python -m tox -- ${{ inputs.test-filter }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.9
    - name: Package
      run: |
        python -m pip install --upgrade --index-url 'https://:2023-04-16@time-machines-pypi.sealsecurity.io/' pip build hatchling==1.14.0
        python -m build -s -w -n
    - name: Upload distributions
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/*
        if-no-files-found: error
